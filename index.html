<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cámara → Telegram</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:#111;color:#eee;font-family:system-ui,sans-serif}
  h1{font-size:18px;margin:0 0 10px}
  input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px}
  button{background:#0a84ff;border:0;font-weight:600}
  button.sec{background:#333}
  button.off{background:#c0392b}
  #wrap{position:relative;margin-top:6px}
  video{width:100%;display:block;border-radius:10px;background:#000}
  #ov{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:10px}
  #log{font:12px monospace;background:#000;padding:8px;border-radius:8px;height:130px;overflow:auto;white-space:pre-wrap;margin-top:6px}
  .row{display:flex;gap:6px}
  label{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h1>📷 Cámara → Telegram</h1>

<label>Token del bot (BotFather)</label>
<input id="tok" placeholder="123456:ABC-DEF...">
<label>Chat ID (el tuyo)</label>
<input id="chat" placeholder="123456789" inputmode="numeric">
<button id="bId" class="sec">🔍 Buscar mi chat ID automáticamente</button>
<label>Clave para que otros se unan (opcional)</label>
<input id="clave" placeholder="ejemplo: casa2026">
<label>Clave de Gemini (aistudio.google.com/apikey)</label>
<input id="gkey" placeholder="AIza...">
<label>Modelo de Gemini</label>
<input id="gmodel" value="gemini-3.1-flash-lite">
<label>Nombre de esta cámara</label>
<input id="name" value="Cámara 1">

<div class="row">
  <button id="bStart">Iniciar cámara</button>
  <button id="bTest" class="sec">Probar Telegram</button>
</div>
<button id="bLink" class="sec">🔗 Copiar link mágico (para mi otro celular)</button>

<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>
</div>

<div class="row">
  <button id="bEdit" class="sec">✏️ Editar zonas</button>
  <button id="bNew" class="sec">➕ Nueva zona</button>
</div>
<div class="row">
  <button id="bName" class="sec">🏷 Renombrar elegida</button>
  <button id="bDel" class="sec">🗑 Borrar elegida</button>
</div>
<button id="bAll" class="sec">🗑 Borrar todas las zonas</button>

<button id="bPhoto" class="sec">📸 Enviar foto ahora</button>
<button id="bMotion" class="sec">Vigilancia: APAGADA</button>
<label>Qué detectar</label>
<select id="mode">
  <option value="per" selected>Personas</option>
  <option value="veh">Vehículos (carro, camión, bus, moto)</option>
  <option value="all">Personas y vehículos</option>
  <option value="mov">Cualquier movimiento</option>
</select>
<label>Gemini en las alertas</label>
<select id="gem">
  <option value="off">Apagado</option>
  <option value="desc" selected>Describir cada alerta</option>
  <option value="ver">Verificar y describir (evita falsas alarmas)</option>
</select>
<label>Sensibilidad (solo para movimiento)</label>
<select id="sens">
  <option value="0.02">Alta</option>
  <option value="0.05" selected>Media</option>
  <option value="0.10">Baja</option>
</select>
<label>Pausa entre alertas</label>
<select id="cool">
  <option value="5000">5 s</option>
  <option value="15000" selected>15 s</option>
  <option value="60000">1 min</option>
</select>

<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
let stream = null, offset = 0, motionOn = false, prev = null, lastSent = 0;
let zones = [], mode = 'idle', cur = [], sel = -1, drag = null, lastTap = null;
let model = null, loadingModel = false, busy = false, shown = [], lastMatch = [];

function log(m){
  const t = new Date().toLocaleTimeString();
  $('log').textContent += '[' + t + '] ' + m + '\n';
  $('log').scrollTop = $('log').scrollHeight;
}

function load(){
  try{
    $('tok').value    = localStorage.getItem('tg_tok')    || '';
    $('chat').value   = localStorage.getItem('tg_chat')   || '';
    $('clave').value  = localStorage.getItem('tg_clave')  || '';
    $('name').value   = localStorage.getItem('tg_name')   || 'Cámara 1';
    $('gkey').value   = localStorage.getItem('tg_gkey')   || '';
    $('gmodel').value = localStorage.getItem('tg_gmodel') || 'gemini-3.1-flash-lite';
    $('gem').value    = localStorage.getItem('tg_gem')    || 'desc';
    $('mode').value   = localStorage.getItem('tg_mode')   || 'per';
    zones = JSON.parse(localStorage.getItem('tg_zones') || '[]')
      .map((z, i) => Array.isArray(z) ? {name: 'Zona ' + (i + 1), pts: z} : z);
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem('tg_tok',    $('tok').value.trim());
    localStorage.setItem('tg_chat',   $('chat').value.trim());
    localStorage.setItem('tg_clave',  $('clave').value.trim());
    localStorage.setItem('tg_name',   $('name').value.trim());
    localStorage.setItem('tg_gkey',   $('gkey').value.trim());
    localStorage.setItem('tg_gmodel', $('gmodel').value.trim());
    localStorage.setItem('tg_gem',    $('gem').value);
    localStorage.setItem('tg_mode',   $('mode').value);
  }catch(e){}
}
function saveZones(){ try{ localStorage.setItem('tg_zones', JSON.stringify(zones)); }catch(e){} }

function fromHash(){
  if(!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if(p.get('t')) $('tok').value = p.get('t');
  if(p.get('c')) $('chat').value = p.get('c');
  if(p.get('k')) $('clave').value = p.get('k');
  if(p.get('g')) $('gkey').value = p.get('g');
  if(p.get('n')) $('name').value = p.get('n');
  save();
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  log('Datos cargados desde el link ✔');
}

function getSubs(){ try{ return JSON.parse(localStorage.getItem('tg_subs') || '[]'); }catch(e){ return []; } }
function setSubs(a){ try{ localStorage.setItem('tg_subs', JSON.stringify(a)); }catch(e){} }
function dests(){
  const owner = $('chat').value.trim();
  return [...new Set([owner, ...getSubs()].filter(Boolean))];
}

function tokenVal(){
  const v = $('tok').value;
  const m = v.match(/\d{6,}:[A-Za-z0-9_-]{30,}/);
  return m ? m[0] : v.trim();
}
const api = m => 'https://api.telegram.org/bot' + tokenVal() + '/' + m;

async function sendText(text, to){
  const list = to ? [to] : dests();
  let ok = false;
  for(const id of list){
    try{
      const r = await fetch(api('sendMessage'), {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id: id, text})
      });
      const j = await r.json();
      if(j.ok) ok = true; else log('Error Telegram (' + id + '): ' + j.description);
    }catch(e){ log('Sin conexión: ' + e.message); }
  }
  return ok;
}

const CLS = {person:'persona', car:'carro', truck:'camión', bus:'bus', motorcycle:'moto', bicycle:'bici'};

function tracePoly(x, pts, w, h){
  x.beginPath();
  pts.forEach((p, i) => { if(i) x.lineTo(p.x*w, p.y*h); else x.moveTo(p.x*w, p.y*h); });
  x.closePath();
}
function zlabel(x, z, w, h, fs){
  const n = z.pts.length;
  let ax = 0, ay = 0;
  z.pts.forEach(p => { ax += p.x; ay += p.y; });
  x.font = fs + 'px sans-serif'; x.textAlign = 'center';
  x.lineWidth = 3; x.strokeStyle = '#000'; x.fillStyle = '#fff';
  x.strokeText(z.name, ax / n * w, ay / n * h);
  x.fillText(z.name, ax / n * w, ay / n * h);
  x.textAlign = 'start';
}

function snap(){
  const v = $('v');
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext('2d');
  x.drawImage(v, 0, 0);
  const lw = Math.max(2, c.width / 300);
  const fs = Math.round(c.width / 35);
  zones.forEach(z => {
    x.strokeStyle = '#0f6'; x.lineWidth = lw;
    tracePoly(x, z.pts, c.width, c.height); x.stroke();
    zlabel(x, z, c.width, c.height, fs);
  });
  x.strokeStyle = '#ff0'; x.fillStyle = '#ff0'; x.lineWidth = lw; x.font = fs + 'px sans-serif';
  lastMatch.forEach(p => {
    x.strokeRect(p.bbox[0], p.bbox[1], p.bbox[2], p.bbox[3]);
    x.fillText((CLS[p.class] || p.class) + ' ' + Math.round(p.score*100) + '%', p.bbox[0] + 4, p.bbox[1] + fs);
  });
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

async function sendPhoto(motivo, to, extra, blob0){
  if(!stream){ log('Primero inicia la cámara'); return; }
  const blob = blob0 || await snap();
  const cap = (motivo + ' (' + $('name').value + ') — ' +
    new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + (extra || '')).slice(0, 1000);
  const list = to ? [to] : dests();
  for(const id of list){
    const fd = new FormData();
    fd.append('chat_id', id);
    fd.append('photo', blob, 'foto.jpg');
    fd.append('caption', cap);
    try{
      const r = await fetch(api('sendPhoto'), {method:'POST', body: fd});
      const j = await r.json();
      log(j.ok ? 'Foto enviada a ' + id + ' ✔' : 'Error (' + id + '): ' + j.description);
    }catch(e){ log('Sin conexión: ' + e.message); }
  }
}

// ---------- Gemini ----------
async function gemini(blob, prompt){
  const key = $('gkey').value.trim();
  if(!key) return null;
  try{
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
    const mod = encodeURIComponent($('gmodel').value.trim() || 'gemini-3.1-flash-lite');
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + mod + ':generateContent?key=' + encodeURIComponent(key);
    const r = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{parts:[{inline_data:{mime_type:'image/jpeg', data:b64}}, {text:prompt}]}],
        generationConfig:{responseMimeType:'application/json'}
      })
    });
    const j = await r.json();
    if(j.error){
      log('Gemini: ' + j.error.message);
      if(j.error.code === 404) log('Cambia el nombre en el campo "Modelo de Gemini" (ej: gemini-flash-latest)');
      return null;
    }
    const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
    const t = parts.map(p => p.text || '').join('');
    try{ return JSON.parse(t.replace(/```json|```/g, '').trim()); }
    catch(e){ return {alerta:true, descripcion:t.slice(0, 300), respuesta:t.slice(0, 300)}; }
  }catch(e){ log('Gemini sin conexión: ' + e.message); return null; }
}

async function alertar(titulo, detalle){
  const g = $('gem').value;
  let extra = '';
  const blob = await snap();
  if(g !== 'off' && $('gkey').value.trim()){
    const info = await gemini(blob,
      'Eres un sistema de vigilancia. Analiza la imagen. Detección automática: ' + detalle + '.\n' +
      'Responde SOLO JSON: {"alerta": true o false, "descripcion": "..."}.\n' +
      'alerta=true solo si de verdad se ve una persona o vehículo (o movimiento relevante).\n' +
      'descripcion: una o dos frases en español: qué hace la persona y cómo va vestida; si es un vehículo, tipo, color y texto o logotipo visible (por ejemplo empresa de mensajería). No inventes.');
    if(info){
      if(g === 'ver' && info.alerta === false){
        log('Gemini descartó la alerta: ' + (info.descripcion || ''));
        lastSent = Date.now() - Math.max(0, parseInt($('cool').value) - 8000);
        return;
      }
      if(info.descripcion) extra = '\n🤖 ' + String(info.descripcion).slice(0, 600);
    }
  }
  await sendPhoto(titulo, undefined, extra, blob);
}

async function startCam(){
  save();
  if(!navigator.mediaDevices || !window.isSecureContext){
    log('⚠ El navegador bloquea la cámara. Abre la página con https://');
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1280}}, audio:false
    });
    $('v').srcObject = stream;
    try{ await navigator.wakeLock.request('screen'); }catch(e){}
    log('Cámara lista');
    await skipOldMessages();
    setInterval(pollCommands, 3000);
    setInterval(tick, 700);
    sendText('✅ ' + $('name').value + ' conectada.\nComandos: /foto /que /activar /pausa /estado', $('chat').value.trim());
  }catch(e){ log('No se pudo abrir la cámara: ' + e.message); }
}

async function skipOldMessages(){
  try{
    const r = await fetch(api('getUpdates?offset=-1'));
    const j = await r.json();
    if(j.ok && j.result.length) offset = j.result[j.result.length-1].update_id + 1;
  }catch(e){}
}

async function pollCommands(){
  try{
    const r = await fetch(api('getUpdates?timeout=0&offset=' + offset));
    const j = await r.json();
    if(!j.ok) return;
    const owner = $('chat').value.trim();
    for(const u of j.result){
      offset = u.update_id + 1;
      const m = u.message;
      if(!m || !m.text) continue;
      const id = String(m.chat.id);
      const parts = m.text.trim().split(/\s+/);
      const cmd = parts[0].toLowerCase().split('@')[0];
      const isOwner = id === owner;
      const subs = getSubs();
      const isSub = isOwner || subs.includes(id);

      if(cmd === '/unirme'){
        const k = $('clave').value.trim();
        if(k && parts[1] === k){
          if(!subs.includes(id)){ subs.push(id); setSubs(subs); }
          sendText('✅ Listo, recibirás las fotos de ' + $('name').value + '.\nComandos: /foto /que /estado /salir', id);
          log('Nuevo suscriptor: ' + id);
        } else {
          sendText('Clave incorrecta. Escribe: /unirme TU_CLAVE', id);
        }
      }
      else if(cmd === '/salir'){ setSubs(subs.filter(x => x !== id)); sendText('Listo, ya no recibirás fotos.', id); }
      else if(cmd === '/start' && !isSub) sendText('Para recibir las fotos escribe: /unirme TU_CLAVE', id);
      else if(!isSub) continue;
      else if(cmd === '/foto') await sendPhoto('📸 Foto pedida', id);
      else if(cmd === '/que'){
        if(!stream || !$('v').videoWidth){ sendText('La cámara no está iniciada.', id); continue; }
        if(!$('gkey').value.trim()){ sendText('Falta la clave de Gemini en la página.', id); continue; }
        const q = parts.slice(1).join(' ') || 'Describe brevemente qué se ve en la escena.';
        const blob = await snap();
        const info = await gemini(blob,
          'Eres un sistema de vigilancia. Responde en español y breve. Pregunta: ' + q +
          '\nResponde SOLO JSON: {"respuesta": "..."}');
        const txt = info && (info.respuesta || info.descripcion);
        await sendPhoto('🤖 ' + (txt ? String(txt).slice(0, 800) : 'Sin respuesta de Gemini'), id, '', blob);
      }
      else if(cmd === '/estado'){
        sendText('Vigilancia: ' + (motionOn ? 'ACTIVADA' : 'apagada') +
          (zones.length ? '\nZonas: ' + zones.map(z => z.name).join(', ') : '\nZonas: toda la imagen'), id);
      }
      else if(isOwner && cmd === '/activar') setMotion(true);
      else if(isOwner && cmd === '/pausa') setMotion(false);
    }
  }catch(e){}
}

// ---------- Zonas (polígonos con nombre) ----------
function pip(x, y, poly){
  let c = false;
  for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const a = poly[i], b = poly[j];
    if(((a.y > y) !== (b.y > y)) && (x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x)) c = !c;
  }
  return c;
}
function zoneNames(cx, cy){ return zones.filter(z => pip(cx, cy, z.pts)).map(z => z.name); }

const ov = $('ov');
function rel(e){
  const r = ov.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
    w: r.width, h: r.height
  };
}
function dpx(a, b, w, h){ return Math.hypot((a.x - b.x) * w, (a.y - b.y) * h); }
function segDist(p, a, b, w, h){
  const ax = a.x*w, ay = a.y*h, bx = b.x*w, by = b.y*h, px = p.x*w, py = p.y*h;
  const dx = bx - ax, dy = by - ay;
  const L = dx*dx + dy*dy || 1;
  let t = ((px - ax)*dx + (py - ay)*dy) / L;
  t = Math.max(0, Math.min(1, t));
  const qx = ax + t*dx, qy = ay + t*dy;
  return {d: Math.hypot(px - qx, py - qy), pt: {x: qx / w, y: qy / h}};
}

function setMode(m){
  mode = m;
  ov.style.touchAction = (m === 'idle') ? 'auto' : 'none';
  $('bEdit').textContent = (m === 'idle') ? '✏️ Editar zonas' : '✔ Listo';
  $('bNew').textContent  = (m === 'draw') ? '✔ Cerrar zona' : '➕ Nueva zona';
  drawOv();
}
function finishZone(){
  if(cur.length >= 3){
    const def = 'Zona ' + (zones.length + 1);
    const nm = prompt('Nombre de la zona (ej: puerta, calle)', def);
    zones.push({name: (nm && nm.trim()) ? nm.trim().slice(0, 30) : def, pts: cur});
    sel = zones.length - 1; saveZones();
    log('Zona "' + zones[sel].name + '" guardada ✔ (' + zones.length + ' en total)');
    cur = []; setMode('edit');
  } else {
    log('Necesitas al menos 3 puntos. Cancelado.');
    cur = []; setMode('idle');
  }
}

function drawOv(){
  const w = ov.clientWidth, h = ov.clientHeight;
  if(ov.width !== w) ov.width = w;
  if(ov.height !== h) ov.height = h;
  const x = ov.getContext('2d');
  x.clearRect(0, 0, w, h);
  zones.forEach((z, zi) => {
    const s = (zi === sel && mode !== 'idle');
    tracePoly(x, z.pts, w, h);
    x.fillStyle = s ? 'rgba(255,200,0,0.22)' : 'rgba(0,255,100,0.15)';
    x.strokeStyle = s ? '#fc0' : '#0f6'; x.lineWidth = 2;
    x.fill(); x.stroke();
    if(mode === 'edit'){
      z.pts.forEach(p => {
        x.beginPath(); x.arc(p.x*w, p.y*h, 8, 0, Math.PI*2);
        x.fillStyle = '#fff'; x.fill(); x.strokeStyle = s ? '#fc0' : '#0f6'; x.lineWidth = 2; x.stroke();
      });
    }
    zlabel(x, z, w, h, 13);
  });
  if(mode === 'draw' && cur.length){
    x.beginPath();
    cur.forEach((p, i) => { if(i) x.lineTo(p.x*w, p.y*h); else x.moveTo(p.x*w, p.y*h); });
    x.strokeStyle = '#fc0'; x.lineWidth = 2; x.stroke();
    cur.forEach((p, i) => {
      x.beginPath(); x.arc(p.x*w, p.y*h, i === 0 ? 11 : 7, 0, Math.PI*2);
      x.fillStyle = i === 0 ? '#0f6' : '#fff'; x.fill();
    });
  }
  const v = $('v');
  if(v.videoWidth){
    const sx = w / v.videoWidth, sy = h / v.videoHeight;
    x.strokeStyle = '#ff0'; x.fillStyle = '#ff0'; x.lineWidth = 2; x.font = '12px sans-serif';
    shown.forEach(p => {
      x.strokeRect(p.bbox[0]*sx, p.bbox[1]*sy, p.bbox[2]*sx, p.bbox[3]*sy);
      x.fillText((CLS[p.class] || p.class) + ' ' + Math.round(p.score*100) + '%', p.bbox[0]*sx + 3, p.bbox[1]*sy + 12);
    });
  }
}

ov.addEventListener('pointerdown', e => {
  if(mode === 'idle') return;
  const p = rel(e);
  if(mode === 'draw'){
    if(cur.length >= 3 && dpx(p, cur[0], p.w, p.h) < 22){ finishZone(); return; }
    cur.push({x: p.x, y: p.y}); drawOv(); return;
  }
  // modo editar: 1) tocar un punto
  for(let zi = zones.length - 1; zi >= 0; zi--){
    const pts = zones[zi].pts;
    for(let vi = 0; vi < pts.length; vi++){
      if(dpx(p, pts[vi], p.w, p.h) < 24){
        sel = zi;
        const now = Date.now();
        if(lastTap && lastTap.zi === zi && lastTap.vi === vi && now - lastTap.t < 400 && pts.length > 3){
          pts.splice(vi, 1); lastTap = null; saveZones(); drawOv(); log('Punto eliminado'); return;
        }
        lastTap = {zi, vi, t: now};
        drag = {zi, vi};
        try{ ov.setPointerCapture(e.pointerId); }catch(err){}
        drawOv(); return;
      }
    }
  }
  // 2) tocar una línea de la zona elegida para agregar un punto
  if(sel >= 0 && zones[sel]){
    const pts = zones[sel].pts;
    for(let i = 0; i < pts.length; i++){
      const s = segDist(p, pts[i], pts[(i + 1) % pts.length], p.w, p.h);
      if(s.d < 14){
        pts.splice(i + 1, 0, s.pt);
        drag = {zi: sel, vi: i + 1}; lastTap = null;
        try{ ov.setPointerCapture(e.pointerId); }catch(err){}
        drawOv(); return;
      }
    }
  }
  // 3) tocar dentro de una zona para elegirla
  sel = -1;
  for(let zi = zones.length - 1; zi >= 0; zi--){
    if(pip(p.x, p.y, zones[zi].pts)){ sel = zi; break; }
  }
  drawOv();
});
ov.addEventListener('pointermove', e => {
  if(!drag) return;
  const p = rel(e);
  const v = zones[drag.zi].pts[drag.vi];
  v.x = p.x; v.y = p.y;
  drawOv();
});
ov.addEventListener('pointerup', () => { if(drag){ drag = null; saveZones(); } });
ov.addEventListener('pointercancel', () => { drag = null; });

$('bEdit').onclick = () => {
  if(mode === 'idle'){
    setMode('edit');
    log('Arrastra un punto para moverlo. Toca una línea para agregar un punto. Doble toque en un punto lo borra.');
  } else { cur = []; drag = null; setMode('idle'); }
};
$('bNew').onclick = () => {
  if(mode === 'draw'){ finishZone(); }
  else { cur = []; sel = -1; setMode('draw'); log('Toca el video para poner cada punto. Cierra con el botón o tocando el primer punto.'); }
};
$('bName').onclick = () => {
  if(sel >= 0 && zones[sel]){
    const n = prompt('Nombre de la zona', zones[sel].name);
    if(n && n.trim()){ zones[sel].name = n.trim().slice(0, 30); saveZones(); drawOv(); log('Zona renombrada: ' + zones[sel].name); }
  } else log('Primero toca una zona en modo Editar');
};
$('bDel').onclick = () => {
  if(sel >= 0 && zones[sel]){ log('Zona "' + zones[sel].name + '" borrada'); zones.splice(sel, 1); sel = -1; saveZones(); drawOv(); }
  else log('Primero toca una zona en modo Editar');
};
$('bAll').onclick = () => { zones = []; sel = -1; saveZones(); drawOv(); log('Sin zonas: se vigila toda la imagen'); };

// ---------- Detección ----------
async function ensureModel(){
  if(model || loadingModel) return;
  if(typeof cocoSsd === 'undefined'){ log('No cargó el modelo de IA. Revisa tu internet y recarga.'); return; }
  loadingModel = true;
  log('Cargando modelo de IA (la primera vez tarda)...');
  try{
    model = await cocoSsd.load({base:'lite_mobilenet_v2'});
    log('Modelo listo ✔');
  }catch(e){ log('Error del modelo: ' + e.message); }
  loadingModel = false;
}
function wanted(c){
  const m = $('mode').value;
  const veh = ['car','truck','bus','motorcycle'];
  if(m === 'per') return c === 'person';
  if(m === 'veh') return veh.includes(c);
  return c === 'person' || veh.includes(c);
}
async function checkAI(){
  if(busy || !model || !$('v').videoWidth) return;
  busy = true;
  try{
    const v = $('v');
    const preds = await model.detect(v);
    const vw = v.videoWidth, vh = v.videoHeight;
    shown = preds.filter(p => p.score > 0.55 && wanted(p.class))
      .map(p => { p.zn = zoneNames((p.bbox[0] + p.bbox[2]/2) / vw, (p.bbox[1] + p.bbox[3]/2) / vh); return p; })
      .filter(p => zones.length === 0 || p.zn.length > 0);
    drawOv();
    const now = Date.now();
    if(shown.length && now - lastSent > parseInt($('cool').value)){
      lastSent = now;
      const cnt = {};
      shown.forEach(p => { const n = CLS[p.class] || p.class; cnt[n] = (cnt[n] || 0) + 1; });
      const txt = Object.entries(cnt).map(([k, n]) => n + ' ' + k).join(', ');
      const zn = [...new Set(shown.flatMap(p => p.zn))].join(', ');
      log('Detectado: ' + txt + (zn ? ' en ' + zn : ''));
      lastMatch = shown.slice();
      await alertar('🚨 ' + txt + (zn ? ' en ' + zn : ''), txt + (zn ? ' (zona: ' + zn + ')' : ''));
      lastMatch = [];
    }
  }catch(e){}
  busy = false;
}

const mc = document.createElement('canvas'); mc.width = 48; mc.height = 36;
const mx = mc.getContext('2d', {willReadFrequently:true});
function checkMotion(){
  if(!$('v').videoWidth) return;
  mx.drawImage($('v'), 0, 0, 48, 36);
  const d = mx.getImageData(0, 0, 48, 36).data;
  const g = new Uint8Array(48*36);
  for(let i=0;i<g.length;i++) g[i] = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3;
  if(prev){
    const regs = zones.length ? zones : [{name:'', pts:null}];
    const thr = parseFloat($('sens').value);
    const hit = [];
    regs.forEach(rg => {
      let n = 0, tot = 0;
      for(let y=0;y<36;y++) for(let x=0;x<48;x++){
        if(rg.pts && !pip((x+0.5)/48, (y+0.5)/36, rg.pts)) continue;
        const i = y*48 + x; tot++;
        if(Math.abs(g[i]-prev[i]) > 30) n++;
      }
      if(tot && n / tot > thr) hit.push({name: rg.name, frac: n / tot});
    });
    const now = Date.now();
    if(hit.length && now - lastSent > parseInt($('cool').value)){
      lastSent = now;
      const zn = hit.map(h => h.name).filter(Boolean).join(', ');
      log('Movimiento' + (zn ? ' en ' + zn : '') + ': ' + Math.round(Math.max(...hit.map(h => h.frac)) * 100) + '%');
      alertar('🚨 Movimiento' + (zn ? ' en ' + zn : ''), 'movimiento sin clasificar' + (zn ? ' (zona: ' + zn + ')' : ''));
    }
  }
  prev = g;
}

function tick(){
  if(!stream) return;
  if(!motionOn){ shown = []; drawOv(); return; }
  if($('mode').value === 'mov'){ drawOv(); checkMotion(); }
  else checkAI();
}

function setMotion(on){
  motionOn = on; prev = null;
  if(!on) shown = [];
  if(on && $('mode').value !== 'mov') ensureModel();
  $('bMotion').textContent = 'Vigilancia: ' + (on ? 'ACTIVADA' : 'APAGADA');
  $('bMotion').className = on ? 'off' : 'sec';
  log('Vigilancia ' + (on ? 'activada' : 'apagada'));
}
$('mode').onchange = () => { save(); prev = null; if(motionOn && $('mode').value !== 'mov') ensureModel(); };
$('gem').onchange = save;

$('bId').onclick = async () => {
  save();
  try{
    const r = await fetch(api('getUpdates'));
    const j = await r.json();
    if(!j.ok){ log('Error: ' + j.description); return; }
    const m = j.result.map(u => u.message).filter(Boolean).pop();
    if(!m){ log('Aún no hay mensajes. Abre tu bot, toca Iniciar y escribe hola.'); return; }
    $('chat').value = m.chat.id; save();
    log('Chat ID encontrado: ' + m.chat.id);
  }catch(e){ log('Sin conexión: ' + e.message); }
};
$('bLink').onclick = async () => {
  save();
  const u = location.origin + location.pathname
    + '#t=' + encodeURIComponent(tokenVal())
    + '&c=' + encodeURIComponent($('chat').value.trim())
    + '&k=' + encodeURIComponent($('clave').value.trim())
    + '&g=' + encodeURIComponent($('gkey').value.trim())
    + '&n=' + encodeURIComponent($('name').value.trim());
  try{ await navigator.clipboard.writeText(u); log('Link copiado. Lleva tus claves: no lo compartas.'); }
  catch(e){ log(u); }
};
$('bStart').onclick  = startCam;
$('bTest').onclick   = async () => { save(); const ok = await sendText('Prueba desde ' + $('name').value); log(ok ? 'Mensaje de prueba enviado ✔' : 'Revisa token y chat ID'); };
$('bPhoto').onclick  = () => sendPhoto('📸 Foto manual');
$('bMotion').onclick = () => setMotion(!motionOn);
load();
fromHash();
drawOv();
</script>
